name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install MCP smoke validator
        run: python -m pip install -r scripts/requirements-mcp-smoke.txt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run MCP tests
        run: cargo nextest run --locked
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run release packaging checks
        run: bash scripts/mcp-release-test.sh
